<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="popup.css"><title>Promo-Flow</title></head>
<body>
<header><h1 id="title"></h1><select id="lang" aria-label="Language"></select></header>
<p id="tagline" class="muted"></p>
<button id="go" class="primary"></button>
<p id="status" class="muted" role="status"></p>
<label for="codes" id="codesL"></label>
<textarea id="codes" rows="4" spellcheck="false" autocomplete="off"></textarea>
<p id="codesHint" class="muted"></p>
<label class="chk"><input type="checkbox" id="tele"> <span id="teleL"></span></label>
<p id="teleHint" class="muted"></p>
<label for="shareMode" id="shareModeL"></label>
<select id="shareMode"><option value="ask"></option><option value="always"></option><option value="never"></option></select>
<label for="api" id="apiL"></label>
<input id="api" type="url" spellcheck="false">
<button id="save"></button>
<hr>
<h2 id="diagTitle"></h2>
<label for="state" id="stateL"></label>
<select id="state">
  <option value="bag"></option><option value="coupon_panel_open"></option><option value="coupon_applied"></option>
  <option value="coupon_error"></option><option value="payment"></option>
</select>
<div class="btns"><button id="copy"></button><button id="dl"></button></div>
<p id="diagNotice" class="muted"></p>
<p id="diagStatus" class="muted" role="status"></p>
<script src="popup.js"></script>
</body></html>
